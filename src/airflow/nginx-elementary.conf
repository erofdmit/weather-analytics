server {
    listen 80;
    server_name localhost;
    
    # Корневая директория с отчетами
    root /usr/share/nginx/html;
    
    # Логирование
    access_log /var/log/nginx/elementary_access.log;
    error_log /var/log/nginx/elementary_error.log;
    
    # Автоматический индекс файлов
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    autoindex_format html;
    
    # Главная страница - Elementary отчет
    location = / {
        try_files /index.html =404;
    }
    
    # Последний отчет (алиас для совместимости)
    location = /latest {
        try_files /index.html =404;
    }
    
    # Все отчеты
    location /reports {
        alias /usr/share/nginx/html;
        autoindex on;
    }
    
    # MIME типы
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
    }
    
    # Кэширование для статических файлов
    location ~* \.(html|css|js|json)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }
    
    # Отключаем кэширование для latest отчета
    location ~* elementary_report_latest\.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
    
    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;
}

