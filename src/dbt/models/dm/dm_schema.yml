  - name: dm_provider_accuracy_overall
    description: >
      Общая точность провайдеров по всем городам.
      
      Агрегированная точность прогнозов для каждого провайдера по всем городам.
      Включает MAE для температуры, влажности и скорости ветра на всех горизонтах прогноза.
      Прогноз сравнивается с реальным средним значением по всем провайдерам.
      
      Использование: Общий рейтинг провайдеров, выбор лучшего провайдера в целом
    config:
      tags: ['dm', 'forecast', 'accuracy', 'overall']
    
    tests:
      # Elementary: Проверка объема данных
      - elementary.volume_anomalies:
          config:
            severity: warn
      
      # Elementary: Аномалии по провайдерам
      - elementary.dimension_anomalies:
          dimensions:
            - provider
          config:
            severity: warn
    
    columns:
      - name: provider_id
        description: "Уникальный идентификатор записи (суррогатный ключ)"
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: provider
        description: "Провайдер прогноза"
        tests:
          # dbt-core: Проверка уникальности
          - unique:
              config:
                severity: error
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error
          # dbt-core: Проверка допустимых значений провайдеров
          - accepted_values:
              values: ['open_meteo', 'openweathermap', 'weatherapi', 'weatherbit']
              config:
                severity: error
          # dbt-core: Проверка связи с ODS
          - relationships:
              to: ref('ods_weather_forecasts')
              field: provider
              config:
                severity: warn
      
      # Средние MAE
      - name: avg_temp_mae
        description: "Средний MAE температуры по всем горизонтам и городам (°C)"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      
      - name: avg_humidity_mae
        description: "Средний MAE влажности по всем горизонтам и городам (%)"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
      
      - name: avg_wind_mae
        description: "Средний MAE скорости ветра по всем горизонтам и городам (км/ч)"
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn

      # MAE температуры по горизонтам
      - name: temp_mae_1h
        description: "MAE температуры для прогноза на 1 час по всем городам (°C)"
      
      - name: temp_mae_5h
        description: "MAE температуры для прогноза на 5 часов по всем городам (°C)"
      
      - name: temp_mae_10h
        description: "MAE температуры для прогноза на 10 часов по всем городам (°C)"
      
      - name: temp_mae_24h
        description: "MAE температуры для прогноза на 24 часа по всем городам (°C)"
      
      - name: temp_mae_48h
        description: "MAE температуры для прогноза на 48 часов по всем городам (°C)"
      
      - name: temp_mae_72h
        description: "MAE температуры для прогноза на 72 часа по всем городам (°C)"
      
      - name: temp_mae_96h
        description: "MAE температуры для прогноза на 96 часов по всем городам (°C)"
      
      - name: temp_mae_120h
        description: "MAE температуры для прогноза на 120 часов по всем городам (°C)"
      
      - name: temp_mae_144h
        description: "MAE температуры для прогноза на 144 часа по всем городам (°C)"
      
      - name: temp_mae_168h
        description: "MAE температуры для прогноза на 168 часов по всем городам (°C)"
      
      # Ранги
      - name: provider_rank_by_temp
        description: "Общий ранг провайдера (по средней температурной ошибке, 1 = лучший)"
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: error

      - name: provider_rank_by_humidity
        description: "Общий ранг провайдера (по средней ошибке влажности, 1 = лучший)"
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: provider_rank_by_wind
        description: "Общий ранг провайдера (по средней ошибке ветра, 1 = лучший)"
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: overall_rank_score
        description: "Общий балл ранга (среднее арифметическое рангов по температуре, влажности и ветру)"
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: error

      - name: total_forecasts
        description: "Общее количество прогнозов для этого провайдера по всем городам"
        tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: ">= 10"
              config:
                severity: warn
