version: 2

models:
  - name: dm_forecast_accuracy_detailed
    description: >
      Детальная витрина для сравнения каждого прогноза с реальными наблюдениями.
      Содержит все прогнозы с вычисленными метриками ошибок (MAE, RMSE, MAPE).
      Используется как источник для агрегированных витрин.
    config:
      tags: ['dm', 'forecast', 'accuracy', 'detailed']
    columns:
      - name: accuracy_id
        description: "Уникальный идентификатор записи"
        data_tests:
          - unique
          - not_null
      
      - name: city
        description: "Город"
        data_tests:
          - not_null
      
      - name: provider
        description: "Провайдер прогноза"
        data_tests:
          - not_null
      
      - name: hours_ahead_interval
        description: "Интервал прогноза (1, 3, 6, 12, 24, 48 часов)"
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 3, 6, 12, 24, 48]
      
      - name: forecast_temperature
        description: "Прогнозная температура (°C)"
      
      - name: actual_temperature
        description: "Реальная температура (°C)"
        data_tests:
          - not_null
      
      - name: temperature_mae
        description: "Абсолютная ошибка температуры"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"

  - name: dm_forecast_accuracy_summary
    description: >
      Агрегированная витрина точности прогнозов по дням и интервалам.
      Показывает средние метрики для каждого провайдера, города и интервала за день.
    config:
      tags: ['dm', 'forecast', 'accuracy', 'summary']
    columns:
      - name: summary_id
        description: "Уникальный идентификатор записи"
        data_tests:
          - unique
          - not_null
      
      - name: provider
        description: "Провайдер прогноза"
        data_tests:
          - not_null
      
      - name: hours_ahead_interval
        description: "Интервал прогноза"
        data_tests:
          - not_null
      
      - name: forecast_count
        description: "Количество прогнозов за день"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: overall_accuracy_score
        description: "Общий балл точности (0-100)"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"

  - name: dm_provider_accuracy_ranking
    description: >
      Рейтинг провайдеров по точности прогнозов для разных интервалов.
      Показывает, какой провайдер наиболее точен для каждого горизонта прогнозирования.
    config:
      tags: ['dm', 'forecast', 'ranking']
    columns:
      - name: ranking_id
        description: "Уникальный идентификатор записи"
        data_tests:
          - unique
          - not_null
      
      - name: provider
        description: "Провайдер прогноза"
        data_tests:
          - not_null
      
      - name: hours_ahead_interval
        description: "Интервал прогноза"
        data_tests:
          - not_null
      
      - name: overall_rank
        description: "Общий ранг провайдера для данного интервала (1 = лучший)"
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      
      - name: overall_accuracy_score
        description: "Общий балл точности"
        data_tests:
          - not_null

models:
  - name: dm_forecast_accuracy_by_interval
    description: >
      DM витрина для дашборда "Provider Performance Comparison".
      Показывает метрики точности прогнозов (MAE, RMSE, accuracy%)
      для каждого провайдера на разных временных горизонтах.
    config:
      tags: ['dm', 'analytics', 'forecast_accuracy']

    data_tests:
      - elementary.all_columns_anomalies:
          timestamp_column: dbt_updated_at
          exclude_prefix: "dbt_"
      - elementary.event_freshness_anomalies:
          event_timestamp_column: dbt_updated_at
          update_timestamp_column: dbt_updated_at

    columns:
      - name: provider
        description: "Провайдер прогноза"
        data_tests:
          - not_null:
              config:
                severity: error

      - name: hours_ahead_interval
        description: "Временной интервал прогноза (1, 3, 6, 12, 24, 48 часов)"
        data_tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: [1, 3, 6, 12, 24, 48]
              config:
                severity: error

      - name: total_forecasts
        description: "Общее количество прогнозов"
        data_tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: error

      - name: temperature_mae
        description: "Mean Absolute Error для температуры (°C)"
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn

      - name: accuracy_within_2deg_pct
        description: "Процент прогнозов с точностью ±2°C"
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"
              config:
                severity: warn

  - name: dm_provider_ranking
    description: >
      DM витрина для дашборда "Overall Provider Ranking".
      Агрегированный рейтинг провайдеров на основе всех метрик точности.
      Включает общий рейтинг и ранги по категориям (краткосрочные/долгосрочные прогнозы).
    config:
      tags: ['dm', 'analytics', 'ranking']
    columns:
      - name: provider
        description: "Провайдер прогноза"
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: overall_rank
        description: "Общий рейтинг провайдера (1 = лучший)"
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: avg_temperature_mae
        description: "Средний MAE температуры по всем интервалам"
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn

      - name: total_forecasts_all_intervals
        description: "Общее количество прогнозов по всем интервалам"
        data_tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: error

  - name: dm_city_weather_summary
    description: >
      DM витрина для дашборда "City Weather Overview".
      Агрегированная статистика по каждому городу с историческими данными.
    config:
      tags: ['dm', 'analytics', 'city_summary']
    columns:
      - name: city
        description: "Название города"
        data_tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: country
        description: "Страна"
        data_tests:
          - not_null:
              config:
                severity: error

      - name: days_tracked
        description: "Количество дней наблюдений"
        data_tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: error

      - name: providers_count
        description: "Количество провайдеров для этого города"
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: warn
