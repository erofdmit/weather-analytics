version: 2

models:
  - name: ods_weather_observations
    description: >
      ODS модель для наблюдений за погодой от разных провайдеров.
      Нормализованные данные о текущей погоде с вычисляемыми полями.
      Инкрементальная загрузка с стратегией delete+insert.
      
      Ключевые особенности:
      - Дедупликация по (city, provider, observation_hour)
      - Вычисляемые поля для аналитики (day_of_week, hour_of_day)
      - Все погодные параметры от провайдеров
    config:
      tags: ['ods', 'weather', 'observations']

    tests:
      # dbt-core: Проверка уникальности комбинации ключевых полей
      # Гарантирует отсутствие дубликатов в ODS слое
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - city
            - provider
            - observation_hour
          config:
            severity: error

      # dbt_utils: Проверка свежести данных (не старше 5 часов)
      # Гарантирует актуальность данных в ODS
      - dbt_utils.recency:
          datepart: hour
          field: observation_hour
          interval: 5
          config:
            severity: error

      # Elementary: Проверка объема данных (ежедневно)
      # Отслеживает аномальные изменения в количестве записей
      - elementary.volume_anomalies:
          timestamp_column: observation_hour
          time_bucket:
            period: day
            count: 1
          config:
            severity: warn

      # Elementary: Аномалии по провайдерам (ежедневно)
      # Проверяет распределение данных по провайдерам
      - elementary.dimension_anomalies:
          dimensions:
            - provider
          timestamp_column: observation_hour
          time_bucket:
            period: day
            count: 1
          config:
            severity: warn

    columns:
      - name: observation_id
        description: "Суррогатный ключ (city + provider + observation_hour)"
        tests:
          # dbt-core: Проверка уникальности суррогатного ключа
          - unique:
              config:
                severity: error
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error

      - name: city
        description: "Название города"
        tests:
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error
          # dbt-core: Проверка связи с таблицей прогнозов
          # Гарантирует, что для каждого города есть прогнозы
          - relationships:
              to: ref('ods_weather_forecasts')
              field: city
              config:
                severity: warn
          # dbt-core: Проверка допустимых значений городов
          - accepted_values:
              values: ['Moscow', 'Saint Petersburg', 'Novosibirsk', 'Yekaterinburg', 
                       'Kazan', 'Vladivostok', 'Murmansk', 'Yuzhno-Sakhalinsk',
                       'London', 'Paris', 'Berlin', 'Madrid', 'Rome',
                       'New York', 'Los Angeles', 'Chicago', 'Miami', 'Toronto']
              config:
                severity: error

      - name: provider
        description: "Провайдер погодных данных"
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: ['open_meteo', 'openweathermap', 'weatherapi', 'weatherbit', 'weatherstack']
              config:
                severity: error

      - name: observation_hour
        description: "Час наблюдения - created_at из raw таблицы, округленный до часа. Показывает, в какой час был выполнен запрос к API."
        tests:
          - not_null:
              config:
                severity: error

      - name: day_of_week
        description: "День недели (0=Воскресенье, 1=Понедельник, ..., 6=Суббота). Вычисляется из observation_hour."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 6"
              config:
                severity: error

      - name: hour_of_day
        description: "Час дня (0-23). Вычисляется из observation_hour."
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 23"
              config:
                severity: error

      - name: observation_date
        description: "Дата наблюдения (без времени). Вычисляется из observation_hour."
        tests:
          - not_null:
              config:
                severity: error

      - name: temperature_celsius
        description: "Температура в °C"
        tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "between -100 and 60"
              config:
                severity: warn
          # Elementary: аномалии в колонке температуры (ежедневно)
          - elementary.column_anomalies:
              column_anomalies:
                - null_count
                - min
                - max
              timestamp_column: observation_hour
              time_bucket:
                period: day
                count: 1
              config:
                severity: warn

      - name: humidity_percent
        description: "Влажность в процентах"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"
              config:
                severity: warn
                where: "humidity_percent is not null"

      - name: wind_speed_kph
        description: "Скорость ветра в км/ч"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
                where: "wind_speed_kph is not null"

      - name: pressure_hpa
        description: "Атмосферное давление в гПа"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 800 and 1100"
              config:
                severity: warn
                where: "pressure_hpa is not null"

      - name: precipitation_mm
        description: "Количество осадков в мм"

      - name: cloud_cover_percent
        description: "Облачность в процентах"

      - name: visibility_km
        description: "Видимость в километрах"

      - name: uv_index
        description: "УФ-индекс"

      - name: feels_like_celsius
        description: "Ощущаемая температура в °C"

      - name: wind_direction_degrees
        description: "Направление ветра в градусах (0-360)"

      - name: weather_condition
        description: "Описание погодных условий"

      - name: source_created_at
        description: "Дата создания записи в источнике (MongoDB)"

      - name: source_updated_at
        description: "Дата обновления записи в источнике"

      - name: source_changed_at
        description: "Дата последнего изменения (для инкрементальной загрузки)"

      - name: processed_dttm
        description: "Дата и время обработки записи в ODS"

  - name: ods_weather_forecasts
    description: >
      ODS модель для прогнозов погоды от разных провайдеров.
      Фильтрует только прогнозы на фиксированные интервалы (1, 5, 10, 24, 48, 72, 96, 120, 144, 168 часов).
      Инкрементальная загрузка с стратегией merge.
      
      Ключевые особенности:
      - Дедупликация по (city, provider, forecast_timestamp, hours_ahead)
      - Вычисляемые поля: forecast_horizon_category, target_datetime
      - Готова для join с observations по target_datetime = observation_hour
    config:
      tags: ['ods', 'weather', 'forecasts']
    
    tests:
      # dbt-core: Проверка уникальности комбинации ключевых полей
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - city
            - provider
            - forecast_timestamp
            - hours_ahead
          config:
            severity: error

      # dbt_utils: Проверка свежести данных (не старше 5 часов)
      - dbt_utils.recency:
          datepart: hour
          field: forecast_run_hour
          interval: 5
          config:
            severity: error
      
      # Elementary: Проверка объема данных (ежедневно)
      - elementary.volume_anomalies:
          timestamp_column: forecast_run_hour
          time_bucket:
            period: day
            count: 1
          config:
            severity: warn
      
      # Elementary: Аномалии по провайдерам (ежедневно)
      - elementary.dimension_anomalies:
          dimensions:
            - provider
          timestamp_column: forecast_run_hour
          time_bucket:
            period: day
            count: 1
          config:
            severity: warn
    columns:
      - name: forecast_id
        description: "Суррогатный ключ (city + provider + forecast_timestamp + hours_ahead)"
        tests:
          # dbt-core: Проверка уникальности суррогатного ключа
          - unique:
              config:
                severity: error
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error

      - name: city
        description: "Название города"
        tests:
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error
          # dbt-core: Проверка допустимых значений городов
          - accepted_values:
              values: ['Moscow', 'Saint Petersburg', 'Novosibirsk', 'Yekaterinburg', 
                       'Kazan', 'Vladivostok', 'Murmansk', 'Yuzhno-Sakhalinsk',
                       'London', 'Paris', 'Berlin', 'Madrid', 'Rome',
                       'New York', 'Los Angeles', 'Chicago', 'Miami', 'Toronto']
              config:
                severity: error

      - name: provider
        description: "Провайдер прогноза"
        tests:
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error
          # dbt-core: Проверка допустимых значений провайдеров
          - accepted_values:
              values: ['open_meteo', 'openweathermap', 'weatherapi', 'weatherbit']
              config:
                severity: error

      - name: forecast_run_hour
        description: "Час запуска прогноза - created_at из raw таблицы, округленный до часа. Показывает, в какой час был выполнен запрос прогноза."
        tests:
          - not_null:
              config:
                severity: error

      - name: hours_ahead
        description: "Горизонт прогноза в часах (из raw таблицы). Допустимые значения: 1, 5, 10, 24, 48, 72, 96, 120, 144, 168 часов."
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: [1, 5, 10, 24, 48, 72, 96, 120, 144, 168]
              config:
                severity: error

      - name: forecast_horizon_category
        description: "Категория горизонта прогноза: short_term (до 10ч), medium_term (до 48ч), long_term (более 48ч)"
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: ['short_term', 'medium_term', 'long_term']
              config:
                severity: error

      - name: target_datetime
        description: "Целевое время прогноза (forecast_run_hour + hours_ahead). Используется для join с observations."
        tests:
          - not_null:
              config:
                severity: error

      - name: forecast_day_of_week
        description: "День недели прогноза (0=Воскресенье, 1=Понедельник, ..., 6=Суббота)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 6"
              config:
                severity: error

      - name: forecast_hour_of_day
        description: "Час дня прогноза (0-23)"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 23"
              config:
                severity: error

      - name: forecast_run_date
        description: "Дата запуска прогноза (без времени)"
        tests:
          - not_null:
              config:
                severity: error

      - name: temperature_celsius
        description: "Прогнозируемая температура в °C"
        tests:
          # dbt-core: Проверка на NULL
          - not_null:
              config:
                severity: error
          # dbt_utils: Проверка диапазона значений
          - dbt_utils.expression_is_true:
              expression: "between -100 and 60"
              config:
                severity: warn
          # Elementary: Аномалии в колонке температуры прогноза (ежедневно)
          - elementary.column_anomalies:
              column_anomalies:
                - null_count
                - min
                - max
                - average
              timestamp_column: forecast_run_hour
              time_bucket:
                period: day
                count: 1
              config:
                severity: warn
              time_bucket:
                period: hour
                count: 1
              config:
                severity: warn

      - name: humidity_percent
        description: "Прогнозируемая влажность в процентах"
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 100"
              config:
                severity: warn
                where: "humidity_percent is not null"

      - name: wind_speed_kph
        description: "Прогнозируемая скорость ветра в км/ч"
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
              config:
                severity: warn
                where: "wind_speed_kph is not null"

      - name: forecast_created_at
        description: "Дата создания прогноза в источнике (MongoDB)"

      - name: source_changed_at
        description: "Дата последнего изменения (для инкрементальной загрузки)"

      - name: processed_dttm
        description: "Дата и время обработки записи в ODS"
