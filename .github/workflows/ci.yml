name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (main + dev)
        working-directory: src/app
        run: uv sync --extra dev

      - name: Run Ruff (linter)
        working-directory: src/app
        run: uv run ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true  # сделать тесты "опциональными"

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (main + dev)
        working-directory: src/app
        run: uv sync --extra dev

      - name: Run tests (pytest)
        run: uv run --directory src/app pytest ../../tests

  dbt:
    name: DBT Dependencies
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt and dependencies
        working-directory: src/dbt
        run: |
          pip install -r requirements.txt
          dbt deps --project-dir . --profiles-dir .

      - name: Verify dbt packages
        working-directory: src/dbt
        run: |
          if [ -d "dbt_packages" ]; then
            echo "✅ dbt packages installed successfully"
            ls -la dbt_packages/
          else
            echo "⚠️ dbt_packages directory not found"
            exit 1
          fi

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [lint, test, dbt]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment..."
            cd ${{ secrets.APP_PATH }}
            echo "📥 Pulling latest changes..."
            git pull origin main
            echo "🐳 Deploying app..."
            cd src/app
            docker compose down
            docker compose up -d --build
            docker image prune -f
            echo "✅ Deployment completed successfully!"
